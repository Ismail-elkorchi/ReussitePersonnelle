services:
  db:
    image: mariadb:${MARIADB_VERSION:-10.11.16}
    environment:
      MARIADB_DATABASE: ${LOCAL_DB_NAME:-wordpress}
      MARIADB_USER: ${LOCAL_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  wordpress:
    image: wordpress:${WORDPRESS_VERSION:-7.0}-php${PHP_VERSION:-8.4}-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LOCAL_HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${LOCAL_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${LOCAL_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${LOCAL_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        defined( 'WP_DEBUG_LOG' ) || define( 'WP_DEBUG_LOG', true );
        defined( 'WP_DEBUG_DISPLAY' ) || define( 'WP_DEBUG_DISPLAY', false );
        defined( 'SCRIPT_DEBUG' ) || define( 'SCRIPT_DEBUG', true );
        defined( 'DISALLOW_FILE_EDIT' ) || define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_CACHE', false );
    volumes:
      - wp-core:/var/www/html
      - ../.local/prod/wp-content/uploads:/var/www/html/wp-content/uploads
      - ../.local/prod/wp-content/plugins/akismet:/var/www/html/wp-content/plugins/akismet
      - ../.local/prod/wp-content/plugins/wordpress-seo:/var/www/html/wp-content/plugins/wordpress-seo
      - ../.local/prod/wp-content/plugins/wp-super-cache:/var/www/html/wp-content/plugins/wp-super-cache
      - ../.local/prod/wp-content/themes/genesis:/var/www/html/wp-content/themes/genesis
      - ../.local/prod/wp-content/themes/twentytwentyfive:/var/www/html/wp-content/themes/twentytwentyfive
      - ../.local/prod/wp-content/themes/twentytwentyfour:/var/www/html/wp-content/themes/twentytwentyfour
      - ../.local/prod/wp-content/themes/twentytwentythree:/var/www/html/wp-content/themes/twentytwentythree
      - ../.local/prod/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../.local/prod/wp-content/languages:/var/www/html/wp-content/languages
      - ../themes/reussitepersonnelle:/var/www/html/wp-content/themes/reussitepersonnelle
      - ../plugins/reussitepersonnelle-core:/var/www/html/wp-content/plugins/reussitepersonnelle-core

  cli:
    image: wordpress:cli-php${PHP_VERSION:-8.4}
    entrypoint: ["wp", "--allow-root"]
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WP_CLI_PHP_ARGS: "-d error_reporting=8191"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${LOCAL_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${LOCAL_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${LOCAL_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        defined( 'WP_DEBUG_LOG' ) || define( 'WP_DEBUG_LOG', true );
        defined( 'WP_DEBUG_DISPLAY' ) || define( 'WP_DEBUG_DISPLAY', false );
        defined( 'SCRIPT_DEBUG' ) || define( 'SCRIPT_DEBUG', true );
        defined( 'DISALLOW_FILE_EDIT' ) || define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_CACHE', false );
    volumes:
      - wp-core:/var/www/html
      - ../.local/prod/wp-content/uploads:/var/www/html/wp-content/uploads
      - ../.local/prod/wp-content/plugins/akismet:/var/www/html/wp-content/plugins/akismet
      - ../.local/prod/wp-content/plugins/wordpress-seo:/var/www/html/wp-content/plugins/wordpress-seo
      - ../.local/prod/wp-content/plugins/wp-super-cache:/var/www/html/wp-content/plugins/wp-super-cache
      - ../.local/prod/wp-content/themes/genesis:/var/www/html/wp-content/themes/genesis
      - ../.local/prod/wp-content/themes/twentytwentyfive:/var/www/html/wp-content/themes/twentytwentyfive
      - ../.local/prod/wp-content/themes/twentytwentyfour:/var/www/html/wp-content/themes/twentytwentyfour
      - ../.local/prod/wp-content/themes/twentytwentythree:/var/www/html/wp-content/themes/twentytwentythree
      - ../.local/prod/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../.local/prod/wp-content/languages:/var/www/html/wp-content/languages
      - ../themes/reussitepersonnelle:/var/www/html/wp-content/themes/reussitepersonnelle
      - ../plugins/reussitepersonnelle-core:/var/www/html/wp-content/plugins/reussitepersonnelle-core

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${LOCAL_PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:-password}
    profiles:
      - tools

volumes:
  db-data:
  wp-core:
